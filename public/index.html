<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle Financeiro - AT2N2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sistema Financeiro</h1>
  <div id="resumo">Saldo Total: R$ 0.00</div>

  <div class="container">
    <!-- CRUD 1: CATEGORIAS -->
    <section class="card">
      <h2>1. Categorias</h2>
      <form id="form-categoria">
        <input type="hidden" id="cat-id">
        <input type="text" id="cat-nome" placeholder="Nome da categoria (ex: Alimentação)" required>
        <button type="submit">Salvar Categoria</button>
      </form>
      <ul id="lista-categorias"></ul>
    </section>

    <!-- CRUD 2: TRANSAÇÕES (COM JOIN) -->
    <section class="card">
      <h2>2. Transações (Join com Categoria)</h2>
      <form id="form-transacao">
        <input type="hidden" id="trans-id">
        <input type="text" id="trans-desc" placeholder="Descrição (ex: Almoço)" required>
        <input type="number" step="0.01" id="trans-valor" placeholder="Valor (R$)" required>
        <select id="trans-tipo">
          <option value="receita">Receita (+)</option>
          <option value="despesa">Despesa (-)</option>
        </select>
        <select id="trans-categoria" required>
          <option value="">Selecione uma categoria...</option>
        </select>
        <button type="submit">Salvar Transação</button>
      </form>
      <ul id="lista-transacoes"></ul>
    </section>

    <!-- CRUD 3: METAS -->
    <section class="card">
      <h2>3. Metas Financeiras</h2>
      <form id="form-meta">
        <input type="hidden" id="meta-id">
        <input type="text" id="meta-titulo" placeholder="Objetivo (ex: Notebook)" required>
        <input type="number" step="0.01" id="meta-valor" placeholder="Valor Alvo (R$)" required>
        <button type="submit">Salvar Meta</button>
      </form>
      <ul id="lista-metas"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
