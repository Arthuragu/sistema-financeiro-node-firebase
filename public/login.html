<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - fin.control$</title>
  <!-- SDKs do Firebase (Compat - simples e direto) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* CARD PRINCIPAL DIVIDIDO EM 2 COLUNAS (IGUAL À IMAGEM) */
    .login-card {
      background: #fff;
      width: 100%;
      max-width: 860px;
      min-height: 500px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      overflow: hidden;
    }

    /* PAINEL ESQUERDO VERDE */
    .painel-verde {
      background-color: #2ecc71;
      color: #fff;
      width: 38%;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .painel-verde .logo {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 40px;
      background: rgba(0, 0, 0, 0.12);
      padding: 8px 18px;
      border-radius: 20px;
    }

    .painel-verde h2 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .painel-verde p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .btn-outline {
      background: transparent;
      color: #fff;
      border: 2px solid #fff;
      padding: 12px 36px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: #fff;
      color: #2ecc71;
    }

    /* PAINEL DIREITO BRANCO (FORMULÁRIO) */
    .painel-form {
      width: 62%;
      padding: 45px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .painel-form h1 {
      color: #2ecc71;
      font-size: 1.7rem;
      margin-bottom: 22px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    form {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .campo-grupo {
      background-color: #f3f4f6;
      border-radius: 8px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .campo-grupo span {
      font-size: 1.1rem;
      color: #888;
    }

    .campo-grupo input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 0.95rem;
      color: #333;
      outline: none;
    }

    .btn-principal {
      background-color: #2ecc71;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.2s;
    }

    .btn-principal:hover {
      background-color: #27ae60;
    }

    .divisor {
      margin: 14px 0;
      font-size: 0.85rem;
      color: #999;
    }

    .btn-google {
      width: 100%;
      max-width: 360px;
      background-color: #fff;
      color: #444;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    .btn-google:hover {
      background-color: #f8f9fa;
      border-color: #bbb;
    }

    #msg-status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #e74c3c;
      text-align: center;
      min-height: 20px;
    }

    /* Responsivo para telas menores */
    @media (max-width: 700px) {
      .login-card { flex-direction: column; }
      .painel-verde, .painel-form { width: 100%; padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- LADO ESQUERDO VERDE -->
    <div class="painel-verde">
      <div class="logo">fin.control$</div>
      <h2 id="lado-titulo">Bem-vindo de volta</h2>
      <p id="lado-texto">Acesse sua conta agora para controlar suas finanças.</p>
      <button type="button" class="btn-outline" id="btn-alternar-modo">ENTRAR</button>
    </div>

    <!-- LADO DIREITO FORMULÁRIO -->
    <div class="painel-form">
      <h1 id="form-titulo">CRIE SUA CONTA</h1>

      <form id="form-auth">
        <div class="campo-grupo" id="grupo-nome">
          <span>👤</span>
          <input type="text" id="auth-nome" placeholder="NOME">
        </div>

        <div class="campo-grupo">
          <span>✉️</span>
          <input type="email" id="auth-email" placeholder="E-MAIL" required>
        </div>

        <div class="campo-grupo">
          <span>🔒</span>
          <input type="password" id="auth-senha" placeholder="SENHA (mín. 6 dígitos)" required>
        </div>

        <button type="submit" class="btn-principal" id="btn-submit">CADASTRAR</button>
      </form>

      <div class="divisor">ou continue com</div>

      <button type="button" class="btn-google" id="btn-google">
        <strong style="color: #4285F4; font-size: 1.1rem;">G</strong> Entrar com Google
      </button>

      <p id="msg-status"></p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyDxCnk3z7q2i_36dfcNihDd3KP3eHoo10g",
  authDomain: "projeto-financeiro-1a95c.firebaseapp.com",
  projectId: "projeto-financeiro-1a95c",
  storageBucket: "projeto-financeiro-1a95c.firebasestorage.app",
  messagingSenderId: "133382964530",
  appId: "1:133382964530:web:5aacc21fd6467cc217032b",
  measurementId: "G-RT8GQBHRYH"
};

    // Inicializa o Firebase com tratamento de erro visível na tela
    let auth = null;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();

      // Se já estiver logado, vai direto para o sistema
      auth.onAuthStateChanged(user => {
        if (user) {
          window.location.href = 'index.html';
        }
      });
    } catch (erro) {
      document.getElementById('msg-status').innerText =
        'Configure o firebaseConfig real no código para ativar o login.';
    }

    // Controle simples para alternar entre "Criar Conta" e "Entrar"
    let modoCadastro = true;
    const btnAlternar = document.getElementById('btn-alternar-modo');

    btnAlternar.addEventListener('click', () => {
      modoCadastro = !modoCadastro;
      document.getElementById('msg-status').innerText = '';

      if (modoCadastro) {
        document.getElementById('form-titulo').innerText = 'CRIE SUA CONTA';
        document.getElementById('btn-submit').innerText = 'CADASTRAR';
        document.getElementById('grupo-nome').style.display = 'flex';
        document.getElementById('lado-titulo').innerText = 'Bem-vindo de volta';
        document.getElementById('lado-texto').innerText = 'Já possui cadastro? Clique abaixo para entrar.';
        btnAlternar.innerText = 'ENTRAR';
      } else {
        document.getElementById('form-titulo').innerText = 'ACESSAR CONTA';
        document.getElementById('btn-submit').innerText = 'ENTRAR';
        document.getElementById('grupo-nome').style.display = 'none';
        document.getElementById('lado-titulo').innerText = 'Novo por aqui?';
        document.getElementById('lado-texto').innerText = 'Crie sua conta agora e organize suas finanças.';
        btnAlternar.innerText = 'CRIAR CONTA';
      }
    });

    // Envio do formulário (Cadastrar ou Entrar com E-mail/Senha)
    document.getElementById('form-auth').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg-status');
      msg.innerText = '';

      if (!auth) {
        msg.innerText = 'Erro: firebaseConfig não configurado no login.html.';
        return;
      }

      const nome = document.getElementById('auth-nome').value;
      const email = document.getElementById('auth-email').value;
      const senha = document.getElementById('auth-senha').value;

      try {
        if (modoCadastro) {
          const credencial = await auth.createUserWithEmailAndPassword(email, senha);
          if (nome) {
            await credencial.user.updateProfile({ displayName: nome });
          }
        } else {
          await auth.signInWithEmailAndPassword(email, senha);
        }
        window.location.href = 'index.html';
      } catch (erro) {
        msg.innerText = 'Erro: ' + erro.message;
      }
    });

    // Login com Google
    document.getElementById('btn-google').addEventListener('click', async () => {
      const msg = document.getElementById('msg-status');
      msg.innerText = '';

      if (!auth) {
        msg.innerText = 'Erro: firebaseConfig não configurado no login.html.';
        return;
      }

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        window.location.href = 'index.html';
      } catch (erro) {
        msg.innerText = 'Erro no Google Login: ' + erro.message;
      }
    });
  </script>
</body>
</html>
